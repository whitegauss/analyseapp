openapi: 3.0.3
info:
  title: AnalyseApp API Gateway
  version: "1.0.0"
  description: |
    Go API Gateway/BFF for AnalyseApp (see PDR.md). This is the sole HTTP
    surface exposed to clients (browser frontend, and in the future
    GAS/VBA/OfficeScript) — it is also the only component that talks to
    Postgres (Supabase) directly. The Python analysis worker sits behind
    this gateway and is not reachable by clients directly.

    Every response (success or error) is wrapped in the same envelope:
    `{data, error, meta}`.

    `/api/v1` is rate-limited per client IP (100 requests/minute by default);
    exceeding it returns `429` with error code `rate_limited` in the same
    envelope.
servers:
  - url: http://localhost:8080
    description: Local (docker compose)

tags:
  - name: health
    description: Liveness/readiness probes (no auth)
  - name: observability
    description: Operational endpoints (no auth) — not part of the {data, error, meta} envelope
  - name: projects
    description: Project CRUD (Supabase JWT required). Every experiment belongs to exactly one project.
  - name: experiments
    description: Experiment CRUD (Supabase JWT required)

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness check
      description: Never touches dependencies (DB, Redis, Worker). Always 200 once the process is up.
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                data: { status: ok }
                error: null
                meta: {}

  /readyz:
    get:
      tags: [health]
      summary: Readiness check
      description: Pings Postgres on every call. Reports not-ready (503) if `DATABASE_URL` isn't configured or the DB is unreachable.
      responses:
        "200":
          description: Ready to serve DB-backed requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                data: { status: ok }
                error: null
                meta: {}
        "503":
          description: Not ready (DB not configured or unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                db_not_configured:
                  value:
                    data: null
                    error: { code: db_not_configured, message: "DATABASE_URL is not set" }
                    meta: {}
                db_unreachable:
                  value:
                    data: null
                    error: { code: db_unreachable, message: "..." }
                    meta: {}

  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics
      description: |
        Prometheus text-exposition format (not the `{data, error, meta}`
        envelope). Includes `http_requests_total`/`http_request_duration_seconds`
        (labeled by method, matched route pattern, and status) and
        `analysis_cache_results_total` (labeled `result=hit|miss`).
        Unauthenticated, same as `/healthz`/`/readyz` — should be firewalled
        off from the public internet in a real deployment.
      responses:
        "200":
          description: Current metric values
          content:
            text/plain:
              schema:
                type: string

  /api/v1/projects:
    post:
      tags: [projects]
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              title: "落下運動の実験"
              description: "2026年度、力学実験レポート用"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          description: Malformed body, or `title` missing/empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [projects]
      summary: List the authenticated user's projects
      description: Most recently created first. No pagination yet.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK (possibly an empty array)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{id}:
    get:
      tags: [projects]
      summary: Get a project by id
      description: Only returns projects owned by the authenticated user. Another user's id (or a nonexistent id) is indistinguishable and returns 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          description: "`id` is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [projects]
      summary: Replace a project's title/description
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
            example:
              title: "落下運動の実験"
              description: "2026年度、力学実験レポート用"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          description: Malformed body, or `title` missing/empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Delete a project
      description: Only deletes projects owned by the authenticated user. Once experiments.project_id exists, experiments belonging to this project will be removed via an ON DELETE CASCADE foreign key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
        "400":
          description: "`id` is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/experiments:
    post:
      tags: [experiments]
      summary: Create an experiment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
            example:
              title: "落下運動の測定"
              raw_data:
                columns:
                  x: [0, 1, 2, 3, 4]
                  y: [1, 3, 5, 7, 9]
                  y_error: [0.1, 0.1, 0.2, 0.1, 0.15]
              config:
                x_axis_label: "時刻 $t$ (s)"
                y_axis_label: "速度 $v$ (m/s)"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Experiment"
        "400":
          description: Malformed body, or `raw_data` missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [experiments]
      summary: List the authenticated user's experiments
      description: Most recently created first. No pagination yet.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK (possibly an empty array)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Experiment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/experiments/{id}:
    get:
      tags: [experiments]
      summary: Get an experiment by id
      description: Only returns experiments owned by the authenticated user. Another user's id (or a nonexistent id) is indistinguishable and returns 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Experiment"
        "400":
          description: "`id` is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [experiments]
      summary: Delete an experiment
      description: Only deletes experiments owned by the authenticated user. Associated analysis_results rows are removed via an ON DELETE CASCADE foreign key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
        "400":
          description: "`id` is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/experiments/{id}/config:
    patch:
      tags: [experiments]
      summary: Replace an experiment's config
      description: "`config` is replaced wholesale (not merged). Used for graph settings such as `x_axis_label`/`y_axis_label`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigRequest"
            example:
              config:
                x_axis_label: "時刻 $t$ (s)"
                y_axis_label: "速度 $v$ (m/s)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Experiment"
        "400":
          description: Malformed body, `config` missing, or `id` is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/experiments/{id}/raw_data:
    patch:
      tags: [experiments]
      summary: Replace an experiment's raw_data
      description: |
        `raw_data` is replaced wholesale (not merged). Invalidates any cached
        `/analyze` results for this experiment (best-effort), since a cached
        result is keyed by type/params but not by raw_data and would
        otherwise keep serving stale analysis output computed from the old
        data for up to the cache's 24h TTL.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRawDataRequest"
            example:
              raw_data:
                columns:
                  x: [0, 1, 2]
                  y: [1.1, 2.9, 5.2]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Experiment"
        "400":
          description: Malformed body, `raw_data` missing, or `id` is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/experiments/{id}/analyze:
    post:
      tags: [experiments]
      summary: Run an analysis against an experiment's stored data
      description: |
        Fetches the experiment's `raw_data` (ownership-checked, same as
        `GET /experiments/{id}`), then proxies `{type, data, params}` to the
        Python worker's `POST /analyze` and returns its response verbatim —
        the worker already replies with the same `{data, error, meta}`
        envelope this API uses, so no re-wrapping happens.

        Successful (200) results are cached in Redis for 24h, keyed by
        `analysis:{experiment_id}:{type}:{params_hash}` (PDR.md section 7).
        A cache hit skips both the experiment lookup and the worker call.
        The response carries `X-Cache: HIT` or `X-Cache: MISS`. An
        unreachable Redis degrades to always-miss rather than failing the
        request.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            example:
              type: linear_regression
              params: { x_log: true, y_log: true }
      responses:
        "200":
          description: Analysis result (from the worker, or from the Redis cache; status/body passed through as-is)
          headers:
            X-Cache:
              description: "`HIT` if served from Redis, `MISS` if the worker was called"
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          type:
                            type: string
                          result:
                            type: object
                            additionalProperties: true
              example:
                data:
                  type: linear_regression
                  result: { slope: 2.0, intercept: 1.0, r_squared: 1.0 }
                error: null
                meta: {}
        "400":
          description: Malformed body, `type` missing, or `id` is not a valid UUID (or a worker-reported analysis error, e.g. unknown type/missing column — passed through with the worker's own error code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Python worker could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                data: null
                error: { code: worker_unreachable, message: "failed to reach analysis worker" }
                meta: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth JWT (`access_token`), verified against the Supabase
        project's JWKS (ES256). Must carry `role: authenticated`.

  parameters:
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing/invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            data: null
            error: { code: unauthorized, message: "missing bearer token" }
            meta: {}
    NotFound:
      description: Resource not found (or not owned by the caller). The exact message varies by endpoint (e.g. "experiment not found", "project not found")
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            data: null
            error: { code: not_found, message: "experiment not found" }
            meta: {}
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    TooManyRequests:
      description: Rate limit exceeded (100 requests/minute per client IP by default)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            data: null
            error: { code: rate_limited, message: "too many requests, please slow down" }
            meta: {}

  schemas:
    Envelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          nullable: true
        error:
          nullable: true
          $ref: "#/components/schemas/APIError"
        meta:
          type: object

    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: experiment not found

    DataSeries:
      type: object
      description: |
        Extensible "named columns" data model (shared with the Python
        worker): not fixed to x/y/error fields, so error bars
        (`y_error`/`x_error`) or future custom series need no schema change.
      required: [columns]
      properties:
        columns:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
          example:
            x: [0, 1, 2]
            y: [1, 3, 5]
            y_error: [0.1, 0.1, 0.2]

    ExperimentConfig:
      type: object
      description: |
        Free-form graph settings. Currently used keys: `x_axis_label` /
        `y_axis_label` (string; `$...$`-delimited segments render as KaTeX
        math, everything else as plain text).
      additionalProperties: true
      example:
        x_axis_label: "時刻 $t$ (s)"
        y_axis_label: "速度 $v$ (m/s)"

    Project:
      type: object
      description: Groups a user's experiments. Every experiment belongs to exactly one project.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    UpdateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    Experiment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: Optional. Omitted/empty is stored as `null`.
        raw_data:
          $ref: "#/components/schemas/DataSeries"
        config:
          $ref: "#/components/schemas/ExperimentConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateExperimentRequest:
      type: object
      required: [raw_data]
      properties:
        title:
          type: string
          nullable: true
        raw_data:
          $ref: "#/components/schemas/DataSeries"
        config:
          $ref: "#/components/schemas/ExperimentConfig"

    UpdateConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/ExperimentConfig"

    UpdateRawDataRequest:
      type: object
      required: [raw_data]
      properties:
        raw_data:
          $ref: "#/components/schemas/DataSeries"

    AnalyzeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Analysis type registered in the Python worker (e.g. `linear_regression`).
        params:
          type: object
          additionalProperties: true
          description: |
            Forwarded to the worker as-is. `linear_regression` accepts
            `x_log`/`y_log` (bool, default `false`) to fit log10(x)/log10(y)
            instead of x/y directly -- a semi-log fit (one of the two) for an
            exponential relationship, a log-log fit (both) for a power law.
            Points with a non-positive value on a log-transformed axis are
            dropped from the fit; fewer than 2 remaining returns
            `insufficient_data`.
